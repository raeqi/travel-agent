<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>漫游 · Wander</title><link rel="stylesheet" href="/style.css"><body><main><header><span>WANDER / 个人探索伙伴</span><span id="status">本地记忆</span></header><section class="hero"><p>世界就在日常之外</p><h1>留一点时间，<br>给没走过的地方。</h1><p>记住你想去的地方，在合适的距离与时间里，提醒你出发。</p><button id="locate">◎ 更新我的位置</button><button class="secondary" id="ask">现在去哪儿？</button><p id="location">位置仅在你授权后获取。关闭页面后，浏览器不会继续采集位置。</p></section><div id="notice" role="status"></div><section class="settings"><label><input type="checkbox" id="proactive"> 开启主动建议收件箱</label><label>今天可探索 <select id="minutes"><option value="30">30 分钟</option><option value="60">1 小时</option><option value="120">2 小时</option><option value="240">半天</option></select></label><button id="check" class="secondary">检查探索机会</button><p>服务运行时每分钟检查；位置超过 30 分钟则等待更新，建议间隔至少 6 小时。建议送达应用收件箱。</p></section><section><h2>为你留意的机会 <small>OPPORTUNITIES</small></h2><div id="messages" class="grid"></div><div id="answers" class="grid"></div></section><section><h2>我的地点记忆 <small>PLACES & MEMORY</small></h2><form id="place-form"><input name="name" placeholder="想去的地点名称" required maxlength="200"><input name="category" placeholder="类别，例如独立书店" required><input name="lat" type="number" step="any" min="-90" max="90" placeholder="纬度 WGS84" required><input name="lon" type="number" step="any" min="-180" max="180" placeholder="经度 WGS84" required><input name="source" placeholder="信息来源，例如店铺官网 URL" required><input name="note" placeholder="为什么想去？这里会成为明确的兴趣证据"><button>加入想去清单</button></form><div id="places" class="grid"></div></section><section><h2>和探索伙伴说一句</h2><form id="chat-form"><input name="text" placeholder="例如：那家书店去过了，是陪朋友去的" required maxlength="1000"><button>发送</button></form><p>自然语言入口需启用本地 Ollama 模型。</p></section><section class="bottom"><div><h2>证据与反馈</h2><div id="evidence"></div></div><div><h2>Agent 的判断</h2><div id="runs"></div></div></section><footer>本地单用户原型 · 不会把路过当作到访，也不会把到访当作喜欢。<button id="delete" class="secondary">删除所有个人数据</button></footer></main><script src="/app.js"></script></body></html>
